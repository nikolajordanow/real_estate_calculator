<div class="calculator">
  <div class="calc-card">
    <div class="calc-inputs">
      @for (input of inputs; track input.label) {
        <div class="input-field">
          <label class="input-label">{{ input.label | translate }}</label>
          <div class="input-wrapper">
            @if (input.showPrefix !== false) {
              <span class="input-prefix">€</span>
            }
            <input
              type="number"
              class="calc-input"
              [placeholder]="input.placeholder"
              [(ngModel)]="input.value"
              (input)="calculateResults()"
            >
          </div>
        </div>
      }
    </div>

    @if (showResults) {
      <div class="results-section">
        <div class="results-grid">
          @for (result of results; track result.label) {
            <div class="result-card">
              <div class="result-label">{{ result.label | translate }}</div>
              <div class="result-value">
                {{ result.value | number : '1.2-2' }}
                @if (result.extention) {
                  <span class="result-ext">{{ result.extention | translate }}</span>
                }
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
